name: Extract LSPatch Source

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TAR.GZ to root
        run: |
          set -e

          ARCHIVE="LSPatch-v1.2-module-ui-source.tar.gz"

          echo "===== 压缩包 ====="
          ls -lh "$ARCHIVE"

          echo
          echo "===== 压缩包内容 ====="
          tar -tzf "$ARCHIVE"

          echo
          echo "===== 解压到仓库根目录 ====="
          tar -xzf "$ARCHIVE" -C .

          echo
          echo "===== 解压完成 ====="
          ls -lah

      - name: Show project files
        run: |
          echo "===== 根目录文件 ====="
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort
