name: Build LSPatch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tar gzip unzip

      - name: Show repository files
        run: |
          echo "===== Repository ====="
          ls -lah
          echo
          find . -maxdepth 2 -type f | sort

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source

          tar -xzf LSPatch-v1.2-module-ui-source.tar.gz -C source

          echo "===== Extracted source ====="
          find source -maxdepth 3 -type f | sort | head -500

      - name: Find Gradle project
        run: |
          echo "===== Searching gradlew ====="

          GRADLEW=$(find source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            echo
            find source -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew = $GRADLEW"
          echo "PROJECT_DIR = $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "===== SDK platforms ====="
          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "===== SDK build-tools ====="
          ls -lah "$ANDROID_SDK_ROOT/build-tools" || true

          echo
          echo "===== sdkmanager ====="
          which sdkmanager || true

      - name: Make gradlew executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Show Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --version

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Find APK
        if: always()
        run: |
          echo "===== APK ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LSPatch-v1.2-module-ui-release
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
