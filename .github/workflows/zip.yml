name: Build LSPatch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tar gzip unzip

      - name: Show repository files
        run: |
          echo "===== 仓库文件 ====="
          find . -maxdepth 2 -type f | sort

      - name: Extract source
        run: |
          mkdir -p source

          tar -xzf LSPatch-v1.2-module-ui-source.tar.gz -C source

          echo "===== 解压后的文件 ====="
          find source -maxdepth 3 -type f | sort | head -300

      - name: Detect project directory
        run: |
          echo "===== 查找 Gradle 项目 ====="

          if [ -f "source/gradlew" ]; then
            echo "PROJECT_DIR=source" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find source -name gradlew -type f -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "错误：没有找到 gradlew"
              find source -maxdepth 4 -type f | sort
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "===== APK 文件 ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LSPatch-v1.2-module-ui-release
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
