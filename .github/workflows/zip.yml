name: Extract TAR.GZ

on:
  workflow_dispatch:
  push:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract
        run: |
          set -e

          ARCHIVE="LSPatch-v1.2-module-ui-source.tar.gz"
          OUT="source"

          echo "===== 压缩包 ====="
          ls -lh "$ARCHIVE"

          echo
          echo "===== 压缩包内部 ====="
          tar -tzf "$ARCHIVE" | head -300

          echo
          echo "===== 解压 ====="
          rm -rf "$OUT"
          mkdir -p "$OUT"
          tar -xzf "$ARCHIVE" -C "$OUT"

          echo
          echo "===== 解压后的完整目录 ====="
          find "$OUT" -type f | sort

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: LSPatch-v1.2-source-extracted
          path: source/
