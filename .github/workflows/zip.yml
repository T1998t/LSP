name: Extract LSPatch Source

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source archive
        shell: bash
        run: |
          set -e

          echo "===== 查找压缩包 ====="
          find . -maxdepth 3 -type f \( \
            -name "LSPatch-v1.2-module-ui-source.tar.gz" \
            -o -name "*.tar.gz" \
            \) -print

          ARCHIVE="./LSPatch-v1.2-module-ui-source.tar.gz"

          if [ ! -f "$ARCHIVE" ]; then
            echo "错误：找不到 $ARCHIVE"
            exit 1
          fi

      - name: Extract LSPatch folder to repository root
        shell: bash
        run: |
          set -e

          ARCHIVE="./LSPatch-v1.2-module-ui-source.tar.gz"

          echo "===== 查看压缩包内容 ====="
          tar -tzf "$ARCHIVE" | head -100

          echo
          echo "===== 解压 LSPatch 文件夹内容到根目录 ====="

          mkdir -p .extract_tmp

          tar -xzf "$ARCHIVE" -C .extract_tmp

          if [ ! -d ".extract_tmp/LSPatch" ]; then
            echo "错误：压缩包中没有 LSPatch 文件夹"
            find .extract_tmp -maxdepth 3 -print
            exit 1
          fi

          cp -a .extract_tmp/LSPatch/. ./

          rm -rf .extract_tmp

          echo
          echo "===== 解压完成，根目录结构 ====="
          find . -maxdepth 2 -type f | sort | head -200

      - name: Remove archive
        shell: bash
        run: |
          rm -f "./LSPatch-v1.2-module-ui-source.tar.gz"

      - name: Commit extracted source
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "Extract LSPatch source to repository root"
          git push
