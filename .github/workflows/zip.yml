name: Extract LSPatch Source

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find archive
        shell: bash
        run: |
          set -e

          echo "===== 当前目录 ====="
          pwd

          echo
          echo "===== 查找压缩包 ====="
          find . -type f -name "LSPatch-v1.2-module-ui-source.tar.gz" -print

          ARCHIVE="./LSPatch-v1.2-module-ui-source.tar.gz"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: 找不到压缩包：$ARCHIVE"
            exit 1
          fi

          echo
          echo "找到压缩包："
          ls -lh "$ARCHIVE"

      - name: Extract archive
        shell: bash
        run: |
          set -e

          ARCHIVE="./LSPatch-v1.2-module-ui-source.tar.gz"
          TMP_DIR="$RUNNER_TEMP/lspatch_extract"

          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          echo "===== 解压压缩包 ====="

          tar -xzf "$ARCHIVE" -C "$TMP_DIR"

          echo "===== 解压完成 ====="

          if [ ! -d "$TMP_DIR/LSPatch" ]; then
            echo "ERROR: 压缩包中没有 LSPatch 文件夹"
            echo
            echo "实际内容："
            find "$TMP_DIR" -maxdepth 3 -print
            exit 1
          fi

          echo "找到：$TMP_DIR/LSPatch"

      - name: Copy LSPatch contents to root
        shell: bash
        run: |
          set -e

          TMP_DIR="$RUNNER_TEMP/lspatch_extract"
          SOURCE="$TMP_DIR/LSPatch"

          echo "===== 将 LSPatch 内容复制到仓库根目录 ====="

          cp -a "$SOURCE"/. ./

          echo "复制完成"

      - name: Remove archive
        shell: bash
        run: |
          set -e

          rm -f "./LSPatch-v1.2-module-ui-source.tar.gz"

          echo "===== 已删除原始压缩包 ====="

      - name: Show result
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "       LSPatch 解压完成"
          echo "========================================"
          echo

          echo "===== 根目录 ====="
          ls -la

          echo
          echo "===== 关键文件 ====="

          for file in \
            "settings.gradle" \
            "settings.gradle.kts" \
            "build.gradle" \
            "build.gradle.kts" \
            "gradlew" \
            "gradlew.bat"; do

            if [ -f "$file" ]; then
              echo "FOUND: $file"
            fi
          done

          echo
          echo "===== app / core ====="

          if [ -d "app" ]; then
            echo "FOUND: app/"
          fi

          if [ -d "core" ]; then
            echo "FOUND: core/"
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== Git 状态 ====="
          git status --short

          git add -A

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit -m "Extract LSPatch source to repository root"

          git push

          echo
          echo "========================================"
          echo "       提交并推送成功"
          echo "========================================"
